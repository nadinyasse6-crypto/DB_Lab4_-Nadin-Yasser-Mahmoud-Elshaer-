<!-- authors.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Authors Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Authors Management</h2>
            <a href="/library" class="btn btn-secondary">Back to Library</a>
        </div>

        <div class="card shadow p-4 bg-white mb-5">
            <h4 class="mb-3">Add New Author & Book</h4>
            
            {% if error_message %}
            <div class="alert alert-danger" role="alert">
                {{ error_message }}
            </div>
            {% endif %}

            <form method="POST" action="/authors">
                <div class="mb-3">
                    <label class="form-label">Author Name</label>
                    <input type="text" class="form-control" name="name" required placeholder="Enter author name...">
                </div>
                <div class="mb-3">
                    <label class="form-label">Country</label>
                    <input type="text" class="form-control" name="country" required placeholder="Enter country...">
                </div>
                <div class="mb-3">
                    <label class="form-label">Book Title</label>
                    <input type="text" class="form-control" name="book_title" placeholder="Enter book title...">
                </div>
                <div class="mb-3">
                    <label class="form-label">Publish Year</label>
                    <input type="number" class="form-control" name="publish_year" placeholder="Enter publish year..." max="2026">
                </div>
                <div class="mb-3">
                    <label class="form-label">Price</label>
                    <input type="number" step="0.01" class="form-control" name="price" placeholder="Enter book price..." min="0">
                </div>
                <div class="mb-3">
                    <label class="form-label">Publisher Name</label>
                    <input type="text" class="form-control" name="publisher_name" placeholder="Enter publisher name...">
                </div>
                <div class="mb-3">
                    <label class="form-label">Category Name</label>
                    <input type="text" class="form-control" name="category_name" placeholder="Enter category name...">
                </div>
                <button type="submit" class="btn btn-success w-100">Save Author & Book</button>
            </form>
        </div>

        <h4 class="mb-3">Authors List</h4>
        <table class="table table-bordered table-striped bg-white">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Country</th>
                </tr>
            </thead>
            <tbody>
                {% for author in authors_list %}
                <tr>
                    <td>{{ author.author_id }}</td>
                    <td>{{ author.name }}</td>
                    <td>{{ author.country }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" class="text-center">No authors added yet.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
