<!-- add_loan.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Loan</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-4">
    <div class="container" style="max-width: 600px;">
        <div class="card shadow p-4">
            <h3 class="mb-4">Add New Book Loan</h3>
            
            {% if error_message %}
            <div class="alert alert-danger" role="alert">
                {{ error_message }}
            </div>
            {% endif %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Select Book:</label>
                    <select name="book_id" class="form-select" required>
                        {% for book in books %}
                        <option value="{{ book.book_id }}">{{ book.title }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Select Member Name:</label>
                    <select name="member_id" class="form-select" required>
                        {% for member in members %}
                        <option value="{{ member.member_id }}">{{ member.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Loan Date:</label>
                    <input type="date" name="loan_date" class="form-control" max="2026-12-31" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Save Loan</button>
                <a href="/loans" class="btn btn-secondary w-100 mt-2">Back to Loans Management</a>
            </form>
        </div>
    </div>
</body>
</html>
