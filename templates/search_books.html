<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Books</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Search Books</h2>
            <a href="/library" class="btn btn-secondary">Back to Library</a>
        </div>

        <div class="card shadow p-4 bg-white mb-5">
            <form method="GET" action="/search_books">
                <div class="mb-3">
                    <label class="form-label">Title Keyword</label>
                    <input type="text" class="form-control" name="title" placeholder="Enter title...">
                </div>

                <div class="mb-3">
                    <label class="form-label">Min Price</label>
                    <input type="number" step="0.01" class="form-control" name="min_price" min="0" placeholder="Enter min price...">
                </div>

                <div class="mb-3">
                    <label class="form-label">Max Price</label>
                    <input type="number" step="0.01" class="form-control" name="max_price" min="0" placeholder="Enter max price...">
                </div>

                <button type="submit" class="btn btn-primary">Search</button>
            </form>
        </div>

        <h4 class="mb-3">Search Results</h4>
        <table class="table table-bordered table-striped bg-white">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Price</th>
                </tr>
            </thead>
            <tbody>
                {% for book in books %}
                <tr>
                    <td>{{ book.book_id }}</td>
                    <td>{{ book.title }}</td>
                    <td>{{ book.price }}</td>
                </tr>
                {% else %}
                <tr>
                    <td colspan="3" class="text-center">No books found matching your criteria.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
