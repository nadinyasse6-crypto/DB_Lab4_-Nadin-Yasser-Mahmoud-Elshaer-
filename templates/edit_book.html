<!-- edit_book.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Book</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 500px;">
    <h3 class="mb-4">Edit Book</h3>
    <form method="POST" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label class="form-label">Book Title</label>
            <input type="text" name="title" value="{{ book.title }}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Price</label>
            <input type="number" step="0.01" name="price" value="{{ book.price }}" class="form-control" min="0" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Publish Year</label>
            <input type="number" name="publish_year" value="{{ book.publish_year }}" class="form-control" max="2026" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Author</label>
            <select name="author_id" class="form-select" required>
                {% for author in authors %}
                    <option value="{{ author.author_id }}" {% if author.author_id == book.author_id %}selected{% endif %}>
                        {{ author.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Publisher</label>
            <select name="publisher_id" class="form-select" required>
                {% for pub in publishers %}
                    <option value="{{ pub.publisher_id }}" {% if pub.publisher_id == book.publisher_id %}selected{% endif %}>
                        {{ pub.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">Category</label>
            <select name="category_id" class="form-select" required>
                {% for cat in categories %}
                    <option value="{{ cat.category_id }}" {% if cat.category_id == book.category_id %}selected{% endif %}>
                        {{ cat.name }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-2">Update Book</button>
        <a href="/catalogue" class="btn btn-secondary w-100">Cancel</a>
    </form>
</div>
</body>
</html>
