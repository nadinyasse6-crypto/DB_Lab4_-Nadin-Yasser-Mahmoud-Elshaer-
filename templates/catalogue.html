<!-- catalogue.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Catalogue</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Library Catalogue</h3>
        <a href="/library" class="btn btn-secondary btn-sm">Back to Library</a>
    </div>

    <table class="table table-bordered align-middle">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Price</th>
                <th>Publish Year</th>
                <th>Author</th>
                <th>Publisher</th>
                <th>Category</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for book in books %}
            <tr>
                <td>{{ book.book_id }}</td>
                <td>{{ book.title }}</td>
                <td>{{ book.price }}</td>
                <td>{{ book.publish_year }}</td>
                <td>{{ book.author_name }}</td>
                <td>{{ book.publisher_name }}</td>
                <td>{{ book.category_name }}</td>
                <td>
                    <a href="/edit_book/{{ book.book_id }}" class="btn btn-warning btn-sm">Edit</a>
                    <a href="/delete_book/{{ book.book_id }}" class="btn btn-danger btn-sm" onclick="return confirm('Are you sure you want to delete this book?')">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
</body>
</html>
